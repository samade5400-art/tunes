name: refresh-charts
on: {schedule: [{cron: "0 6 * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch.py
      - run: git config user.name bot && git config user.email bot@users.noreply.github.com && git add data && (git diff --cached --quiet || (git commit -m "refresh charts" && git push))
